<!-- @dsCard group="Type" viewport="700x210" name="Headings" subtitle="Inter at 650 and 600; tracking tightens as the size grows" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="../glass.css" />
<style>
  .page { padding: 22px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; }
  .l { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; }
  .h { font-family: var(--font-mono); font-size: 11px; line-height: 14px; color: var(--text-muted); white-space: nowrap; }
  .h1 { margin: 0; font: var(--font-display); letter-spacing: var(--tracking-tight); }
  .h2 { margin: 0; font: var(--font-h2); letter-spacing: var(--tracking-snug); }
  .h3 { margin: 0; font: var(--font-card-title); letter-spacing: var(--tracking-text); }
  .nav { margin: 0; font: 500 var(--text-base)/20px var(--font-sans); letter-spacing: var(--tracking-text); color: var(--text-secondary); }
</style>
</head>
<body style="min-height: 100vh; background: var(--ambient-radial), var(--bg-void)">
  <div class="page">
    <div class="l"><p class="h1">Good evening</p><span class="h">page H1 · 28/34 · 650 · -0.02em (24/30 under 760px)</span></div>
    <div class="l"><p class="h2">Up next</p><span class="h">section title · 20/26 · 650 · -0.015em</span></div>
    <div class="l"><p class="h3">Severance</p><span class="h">card title · 16/24 · 600 · -0.01em</span></div>
    <div class="l"><p class="nav">Library</p><span class="h">nav, buttons · 14/20 · 500 to 600 · -0.01em</span></div>
  </div>
</body>
</html>
