<!-- @dsCard group="Colors" viewport="700x210" name="Text and hairlines" subtitle="Translucent-white text ramp; white hairlines, aqua only for emphasis and focus" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="../glass.css" />
<style>
  .page { position: relative; z-index: 1; padding: 20px 24px; box-sizing: border-box; }
  .panel { padding: 18px 20px; display: flex; gap: 28px; }
  .text { flex: 1.2; display: flex; flex-direction: column; gap: 4px; }
  .t { display: flex; justify-content: space-between; align-items: baseline; font: var(--font-body); }
  .h { font-family: var(--font-mono); font-size: 11px; line-height: 14px; color: var(--text-muted); }
  .lines { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; align-content: start; }
  .b { height: 26px; border-radius: var(--radius-sm); display: flex; align-items: center; padding: 0 10px; }
</style>
</head>
<body>
  <div class="ambient" aria-hidden="true"><div class="ambient-sample"></div><div class="ambient-tint"></div></div>
  <div class="page">
    <section class="glass-panel glass-rim panel">
      <div class="text">
        <div class="t" style="color: var(--text-primary)">Primary <span class="h">#F3F8FA</span></div>
        <div class="t" style="color: var(--text-strong)">Strong <span class="h">.86</span></div>
        <div class="t" style="color: var(--text-secondary)">Secondary <span class="h">.80</span></div>
        <div class="t" style="color: var(--text-muted)">Muted <span class="h">.74</span></div>
        <div class="t" style="color: var(--text-faint)">Placeholder only <span class="h">.66</span></div>
      </div>
      <div class="lines">
        <div class="b h" style="box-shadow: inset 0 0 0 1px var(--border-faint)">faint .04</div>
        <div class="b h" style="box-shadow: inset 0 0 0 1px var(--border-subtle)">subtle .07</div>
        <div class="b h" style="box-shadow: inset 0 0 0 1px var(--border-soft)">soft .10</div>
        <div class="b h" style="box-shadow: inset 0 0 0 1px var(--border-default)">default .14</div>
        <div class="b h" style="box-shadow: inset 0 0 0 1px var(--border-strong)">strong aqua .42</div>
        <div class="b h" style="outline: 2px solid var(--border-focus); outline-offset: 2px">focus #9BE7F5</div>
      </div>
    </section>
  </div>
</body>
</html>
