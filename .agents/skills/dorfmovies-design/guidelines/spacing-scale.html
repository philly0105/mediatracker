<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing and layout" subtitle="4px grid; 24px shell padding and panel gap; panels pad 20 to 28" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="../glass.css" />
<style>
  .page { padding: 20px 24px; box-sizing: border-box; display: flex; gap: 36px; }
  .scale { display: flex; gap: 10px; align-items: flex-end; }
  .s { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .bar { width: 14px; background: var(--accent); border-radius: 2px; }
  .h { font-family: var(--font-mono); font-size: 10px; line-height: 13px; color: var(--text-muted); }
  .layout { display: flex; flex-direction: column; gap: 6px; font: var(--font-meta); color: var(--text-secondary); }
  .layout b { color: var(--text-primary); font-weight: var(--weight-semibold); font-variant-numeric: tabular-nums; display: inline-block; width: 64px; }
</style>
</head>
<body>
  <div class="page">
    <div class="scale">
      <div class="s"><div class="bar" style="height: var(--space-1)"></div><div class="h">4</div></div>
      <div class="s"><div class="bar" style="height: var(--space-2)"></div><div class="h">8</div></div>
      <div class="s"><div class="bar" style="height: var(--space-3)"></div><div class="h">12</div></div>
      <div class="s"><div class="bar" style="height: var(--space-4)"></div><div class="h">16</div></div>
      <div class="s"><div class="bar" style="height: var(--space-5)"></div><div class="h">20</div></div>
      <div class="s"><div class="bar" style="height: var(--space-6)"></div><div class="h">24</div></div>
      <div class="s"><div class="bar" style="height: var(--space-7)"></div><div class="h">28</div></div>
      <div class="s"><div class="bar" style="height: var(--space-8)"></div><div class="h">32</div></div>
      <div class="s"><div class="bar" style="height: var(--space-10)"></div><div class="h">40</div></div>
      <div class="s"><div class="bar" style="height: var(--space-12)"></div><div class="h">48</div></div>
      <div class="s"><div class="bar" style="height: var(--space-16)"></div><div class="h">64</div></div>
    </div>
    <div class="layout">
      <div><b>24</b>shell padding and panel gap (12 under 760px)</div>
      <div><b>232</b>glass sidebar, lg and up</div>
      <div><b>76</b>icon rail, md to lg</div>
      <div><b>1440</b>content column (shell max 1720)</div>
      <div><b>720</b>settings and import column</div>
    </div>
  </div>
</body>
</html>
