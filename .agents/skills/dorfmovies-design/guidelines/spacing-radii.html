<!-- @dsCard group="Spacing" viewport="700x170" name="Corner radii" subtitle="28 containers, 22 slab, 20 rows, 16 inset cards, 14 controls and posters, pills for buttons" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="../glass.css" />
<style>
  .page { padding: 22px 20px; box-sizing: border-box; display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; align-items: end; }
  .r { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .box { width: 56px; height: 56px; background: var(--glass-card-hover); box-shadow: var(--glass-row-edge); }
  .n { font: var(--font-caption); font-weight: var(--weight-semibold); color: var(--text-primary); }
  .h { font-family: var(--font-mono); font-size: 10px; line-height: 13px; color: var(--text-muted); text-align: center; white-space: nowrap; }
</style>
</head>
<body style="min-height: 100vh; background: var(--ambient-radial), var(--bg-void)">
  <div class="page">
    <div class="r"><div class="box" style="border-radius: var(--radius-2xl)"></div><div class="n">28</div><div class="h">2xl<br>panels</div></div>
    <div class="r"><div class="box" style="border-radius: var(--radius-slab)"></div><div class="n">22</div><div class="h">slab<br>hero text</div></div>
    <div class="r"><div class="box" style="border-radius: var(--radius-row)"></div><div class="n">20</div><div class="h">row<br>rows</div></div>
    <div class="r"><div class="box" style="border-radius: var(--radius-lg)"></div><div class="n">16</div><div class="h">lg<br>inset cards</div></div>
    <div class="r"><div class="box" style="border-radius: var(--radius-md)"></div><div class="n">14</div><div class="h">md / xl<br>nav, poster</div></div>
    <div class="r"><div class="box" style="border-radius: var(--radius-thumb)"></div><div class="n">12</div><div class="h">thumb<br>thumbs</div></div>
    <div class="r"><div class="box" style="border-radius: var(--radius-sm)"></div><div class="n">8</div><div class="h">sm<br>skeletons</div></div>
    <div class="r"><div class="box" style="border-radius: var(--radius-xs)"></div><div class="n">6</div><div class="h">xs<br>kbd</div></div>
    <div class="r"><div class="box" style="width: 80px; height: 44px; border-radius: var(--radius-pill)"></div><div class="n">9999</div><div class="h">pill<br>buttons</div></div>
  </div>
</body>
</html>
