<!-- @dsCard group="Type" viewport="700x190" name="Numerals" subtitle="Tabular everywhere; stats are 28/34 at 650 over a muted label, no box of their own" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="../glass.css" />
<style>
  .page { position: relative; z-index: 1; padding: 20px 24px; box-sizing: border-box; }
  .panel { padding: 20px 24px; display: flex; gap: 36px; align-items: center; }
  .stat .v { font: var(--font-stat); letter-spacing: var(--tracking-tighter); font-variant-numeric: tabular-nums; }
  .stat .k { font: var(--font-meta); color: var(--text-muted); }
  .seg { display: flex; align-items: center; gap: 10px; }
  .segs { display: flex; gap: 3px; width: 160px; }
  .segs i { flex: 1; height: 4px; border-radius: 2px; background: var(--progress-track); }
  .segs i.w { background: var(--accent); }
  .segs i.n { background: var(--accent-tint); }
  .count { font: var(--font-caption); color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .ring { position: relative; width: 48px; height: 48px; }
  .ring span { position: absolute; inset: 0; display: grid; place-items: center; font: var(--weight-heading) var(--text-sm)/18px var(--font-sans); letter-spacing: var(--tracking-text); font-variant-numeric: tabular-nums; color: var(--text-primary); }
</style>
</head>
<body>
  <div class="ambient" aria-hidden="true"><div class="ambient-sample"></div><div class="ambient-tint"></div></div>
  <div class="page">
    <section class="glass-panel glass-rim panel">
      <div class="stat"><div class="v">42</div><div class="k">Watched this year</div></div>
      <div class="stat"><div class="v">118h</div><div class="k">Hours</div></div>
      <div class="seg">
        <div class="segs"><i class="w"></i><i class="w"></i><i class="w"></i><i class="w"></i><i class="w"></i><i class="w"></i><i class="n"></i><i></i><i></i><i></i></div>
        <span class="count">6 of 10</span>
      </div>
      <div class="ring" role="img" aria-label="Season 2, 6 of 10 watched">
        <svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="22" fill="none" stroke="var(--progress-track)" stroke-width="4" />
          <circle cx="24" cy="24" r="22" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="82.9 138.2" transform="rotate(-90 24 24)" />
        </svg>
        <span>S2</span>
      </div>
    </section>
  </div>
</body>
</html>
