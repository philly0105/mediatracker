<!-- @dsCard group="Brand" viewport="700x170" name="Mark and wordmark" subtitle="Rounded-square D beside DorfMovies at 17/22, weight 650; the app icon uses #EAF6F9 and #08161C" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="../glass.css" />
<style>
  .page { position: relative; z-index: 1; height: 170px; padding: 0 32px; box-sizing: border-box; display: flex; align-items: center; gap: 40px; }
  .lockup { display: flex; align-items: center; gap: 10px; }
  .word { font-weight: var(--weight-heading); letter-spacing: -0.02em; color: var(--text-primary); }
  .sm .word { font-size: 17px; line-height: 22px; }
  .lg .word { font-size: 34px; line-height: 44px; }
  .chrome { padding: 16px 18px; border-radius: var(--radius-2xl); }
  .col { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .h { font-family: var(--font-mono); font-size: 10px; line-height: 13px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="ambient" aria-hidden="true"><div class="ambient-sample"></div><div class="ambient-tint"></div></div>
  <div class="page">
    <div class="col">
      <div class="glass-panel glass-rim chrome sm lockup">
        <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="0.5" y="0.5" width="31" height="31" rx="10" fill="var(--text-primary)" />
          <path d="M10.5 8h5.7a8 8 0 0 1 0 16h-5.7z" fill="var(--ink)" />
          <circle cx="16.2" cy="16" r="2.6" fill="var(--text-primary)" />
        </svg>
        <span class="word">DorfMovies</span>
      </div>
      <span class="h">sidebar · mark 28 · 17/22</span>
    </div>
    <div class="col">
      <div class="lg lockup">
        <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="0.5" y="0.5" width="31" height="31" rx="10" fill="var(--text-primary)" />
          <path d="M10.5 8h5.7a8 8 0 0 1 0 16h-5.7z" fill="var(--ink)" />
          <circle cx="16.2" cy="16" r="2.6" fill="var(--text-primary)" />
        </svg>
        <span class="word">DorfMovies</span>
      </div>
      <span class="h">2x</span>
    </div>
    <div class="col">
      <svg width="64" height="64" viewBox="0 0 32 32" role="img" aria-label="App icon">
        <rect x="0.5" y="0.5" width="31" height="31" rx="10" fill="#EAF6F9" />
        <path d="M10.5 8h5.7a8 8 0 0 1 0 16h-5.7z" fill="#08161C" />
        <circle cx="16.2" cy="16" r="2.6" fill="#EAF6F9" />
      </svg>
      <span class="h">icon #EAF6F9 · #08161C</span>
    </div>
  </div>
</body>
</html>
