name: CI

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same branch makes the first run pointless; cancel it
# rather than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Next 16 requires >=20.9; 22 is what the app is developed against.
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm run test:run

      # The build reads the public Supabase vars at module scope, so it needs
      # placeholders to get past import time. Nothing here reaches a network:
      # every route under app/(app) is dynamic and renders on demand.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: https://dorfmovies.vercel.app
